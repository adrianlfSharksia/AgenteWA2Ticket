version: '3.8'

services:
  whatsapp-agent:
    build: .
    container_name: agentewa2ticket
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - API_ENDPOINT=${API_ENDPOINT}
      - API_KEY=${API_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME}
      - DB_PATH=/app/data/database.db
    volumes:
      - ./data:/app/data
      - ./.wwebjs_auth:/app/.wwebjs_auth
      - ./.wwebjs_cache:/app/.wwebjs_cache
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
